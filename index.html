
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>315 × 283 CROSSOVER GENERATOR</title>
<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 18px;
  background: #f7f6fb;
  color: #292536;
  font-family: "Helvetica Neue", sans-serif;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 32px;
  letter-spacing: 2px;
  color: #00A2B6;
  margin: 20px 0 5px;
  font-weight: 800;
}

.subtitle {
  text-align: center;
  color: #70BFC9;
  font-size: 11px;
  letter-spacing: 3px;
  margin-bottom: 35px;
}

.panel {
  background: #ffffff;
  border: 1px solid #D8EDF0;
  border-radius: 18px;
  padding: 22px;
  margin-top: 22px;
  box-shadow: 0 8px 25px rgba(80, 62, 120, 0.06);
}

.label {
  color: #00A2B6;
  font-size: 10px;
  letter-spacing: 2.5px;
  font-weight: bold;
  margin-bottom: 14px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 16px;
  background: #00A2B6;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 4px 12px rgba(118, 96, 181, 0.18);
}

button.secondary {
  background: #eeeaf6;
  color: #007F8F;
  box-shadow: none;
}

.result {
  display: none;
}

.result.show {
  display: block;
}

.song {
  font-size: 25px;
  font-weight: bold;
  line-height: 1.5;
  color: #382d52;
}

.songAgency {
  color: #9589a8;
  font-size: 13px;
  margin-top: 7px;
}

.count {
  color: #a097b0;
  font-size: 12px;
  margin-bottom: 14px;
  letter-spacing: 1px;
}

.idols {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.idol {
  background: #faf9fc;
  border: 1px solid #E5F5F7;
  border-radius: 11px;
  padding: 14px 12px;
}

.agency {
  font-size: 10px;
  margin-bottom: 6px;
  font-weight: bold;
}

.agency.sidem {
  color: #0fbe94;
}

.agency.shiny {
  color: #8dbbff;
}

.name {
  font-size: 14px;
  font-weight: bold;
  color: #393348;
}

hr {
  border: 0;
  border-top: 1px solid #eeeaf4;
  margin: 24px 0;
}

.note {
  text-align: center;
  color: #b0a8bd;
  font-size: 10px;
  letter-spacing: 1px;
  margin-top: 30px;
}

@media (max-width: 380px) {
  .song {
    font-size: 21px;
  }

  .panel {
    padding: 17px;
  }
}
  
/* ===== 文字サイズ・視認性の調整 ===== */

h1 {
  font-size: 34px;
}

.subtitle {
  font-size: 12px;
  color: #7cabb0;
}

.label {
  font-size: 12px;
  color: #008b9c;
  letter-spacing: 2.5px;
}

button {
  font-size: 17px;
  padding: 17px;
}

.song {
  font-size: 28px;
  line-height: 1.45;
  color: #302b3b;
}

.songAgency {
  font-size: 15px;
  color: #777181;
  margin-top: 9px;
}

.count {
  font-size: 14px;
  color: #777181;
  margin-bottom: 17px;
}

.idols {
  gap: 12px;
}

.idol {
  padding: 16px 14px;
  border-radius: 13px;
}

.agency {
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 8px;
}

.agency.sidem {
  color: #0fbe94;
}

.agency.shiny {
  color: #8dbbff;
}

.name {
  font-size: 17px;
  line-height: 1.5;
  color: #302b3b;
}

.note {
  font-size: 11px;
  color: #898394;
}

@media (max-width: 380px) {
  .song {
    font-size: 24px;
  }

  .name {
    font-size: 15px;
  }
}
</style>
</head>
<body>
<div class="container">
  <h1>315 × 283</h1>
  <div class="subtitle">CROSSOVER UNIT GENERATOR</div>

  <button onclick="generate()">ユニットを生成する</button>

  <div class="panel result" id="result">
    <div class="label">SELECTED SONG</div>
    <div class="song" id="song"></div>
    <div class="songAgency" id="songAgency"></div>
    <hr>
    <div class="label">YOUR CROSSOVER UNIT</div>
    <div class="count" id="count"></div>
    <div class="idols" id="idols"></div>
    <hr>
    <button class="secondary" onclick="copyResult()">結果をコピー</button>
    <button onclick="generate()">もう一度抽選する</button>
  </div>

  <div class="note">315 × 283 CROSSOVER GENERATOR</div>
</div>

<script>
const idolsData = [
  // SideM：49人
  {name:"天ヶ瀬 冬馬",work:"SideM"},
  {name:"御手洗 翔太",work:"SideM"},
  {name:"伊集院 北斗",work:"SideM"},

  {name:"桜庭 薫",work:"SideM"},
  {name:"柏木 翼",work:"SideM"},
  {name:"鷹城 恭二",work:"SideM"},
  {name:"ピエール",work:"SideM"},
  {name:"渡辺 みのり",work:"SideM"},
  {name:"蒼井 悠介",work:"SideM"},
  {name:"蒼井 享介",work:"SideM"},
  {name:"握野 英雄",work:"SideM"},
  {name:"木村 龍",work:"SideM"},
  {name:"信玄 誠司",work:"SideM"},
  {name:"猫柳 キリオ",work:"SideM"},
  {name:"華村 翔真",work:"SideM"},
  {name:"清澄 九郎",work:"SideM"},
  {name:"秋山 隼人",work:"SideM"},
  {name:"冬美 旬",work:"SideM"},
  {name:"榊 夏来",work:"SideM"},
  {name:"若里 春名",work:"SideM"},
  {name:"伊瀬谷 四季",work:"SideM"},
  {name:"紅井 朱雀",work:"SideM"},
  {name:"黒野 玄武",work:"SideM"},
  {name:"神谷 幸広",work:"SideM"},
  {name:"東雲 荘一郎",work:"SideM"},
  {name:"アスラン＝ベルゼビュートⅡ世",work:"SideM"},
  {name:"卯月 巻緒",work:"SideM"},
  {name:"水嶋 咲",work:"SideM"},
  {name:"岡村 直央",work:"SideM"},
  {name:"橘 志狼",work:"SideM"},
  {name:"姫野 かのん",work:"SideM"},
  {name:"硲 道夫",work:"SideM"},

  {name:"兜 大吾",work:"SideM"},
  {name:"九十九 一希",work:"SideM"},
  {name:"葛之葉 雨彦",work:"SideM"},
  {name:"北村 想楽",work:"SideM"},
  {name:"古論 クリス",work:"SideM"},
  {name:"都築 圭",work:"SideM"},
  {name:"神楽 麗",work:"SideM"},
  {name:"天峰 秀",work:"SideM"},
  {name:"花園 百々人",work:"SideM"},
  {name:"眉見 鋭心",work:"SideM"},

  // シャニマス：28人
  {name:"櫻木 真乃",work:"シャニマス"},
  {name:"風野 灯織",work:"シャニマス"},
  {name:"八宮 めぐる",work:"シャニマス"},

  {name:"大崎 甜花",work:"シャニマス"},

  {name:"芹沢 あさひ",work:"シャニマス"},
  {name:"黛 冬優子",work:"シャニマス"},

  {name:"浅倉 透",work:"シャニマス"},
  {name:"樋口 円香",work:"シャニマス"},
  {name:"福丸 小糸",work:"シャニマス"},
  {name:"市川 雛菜",work:"シャニマス"},
  {name:"七草 にちか",work:"シャニマス"},
  {name:"緋田 美琴",work:"シャニマス"},
  {name:"斑鳩 ルカ",work:"シャニマス"},
  {name:"鈴木 羽那",work:"シャニマス"},
  {name:"郁田 はるき",work:"シャニマス"}
];

async function generate() {
  try {
    const response = await fetch("./songs.json");
    if (!response.ok) throw new Error("楽曲データを読み込めません");

    const songsData = await response.json();
    if (!songsData.length) throw new Error("楽曲データが空です");

    const count = Math.floor(Math.random() * 10) + 1;
const song = songsData[Math.floor(Math.random() * songsData.length)];

// 楽曲と異なる作品のアイドルを必ず1人選ぶ
const crossoverWork = song.work === "SideM" ? "シャニマス" : "SideM";

const crossoverIdol = shuffle(
  idolsData.filter(idol => idol.work === crossoverWork)
)[0];

// 残りの人数は全アイドルからランダムに選ぶ
const remainingIdols = shuffle(
  idolsData.filter(idol => idol.name !== crossoverIdol.name)
).slice(0, count - 1);

const selected = shuffle([crossoverIdol, ...remainingIdols]);

    document.getElementById("count").textContent = count + " MEMBERS";
    document.getElementById("idols").innerHTML = selected.map(idol => `
      <div class="idol">
        <div class="agency ${idol.work === "SideM" ? "sidem" : "shiny"}">${idol.work}</div>
        <div class="name">${idol.name}</div>
      </div>
    `).join("");

    document.getElementById("song").textContent = song.title;
    document.getElementById("songAgency").textContent = song.artist || "";

    document.getElementById("result").classList.add("show");
  } catch (error) {
    alert("楽曲データの読み込みに失敗しました。");
    console.error(error);
  }
}

function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}


function copyResult() {
  const song = document.getElementById("song").textContent;
  const members = [...document.querySelectorAll("#idols .name")]
    .map(el => el.textContent).join("、");
  const text = song + "\n" + members;
  navigator.clipboard.writeText(text).then(() => {
    alert("結果をコピーしました！");
  }).catch(() => {
    alert("コピーできませんでした。");
  });
}
</script>
</body>
</html>
