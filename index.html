
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>315 × 283 CROSSOVER GENERATOR</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 16px;
  background: #11131b;
  color: #f5f5f7;
  font-family: sans-serif;
}
.container {
  max-width: 600px;
  margin: auto;
}
h1 {
  text-align: center;
  font-size: 25px;
  letter-spacing: 1px;
  margin: 12px 0 6px;
}
.subtitle {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  margin-bottom: 28px;
}
.panel {
  background: #1d202b;
  border: 1px solid #343847;
  border-radius: 14px;
  padding: 20px;
  margin-top: 18px;
}
.label {
  color: #aeb4c7;
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: bold;
  margin-bottom: 14px;
}
button {
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 14px;
  background: #8d78e8;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}
button.secondary {
  background: #343847;
}
.result { display: none; }
.result.show { display: block; }
.song {
  font-size: 23px;
  font-weight: bold;
  line-height: 1.5;
}
.songAgency {
  color: #aaa;
  font-size: 13px;
  margin-top: 5px;
}
.count {
  color: #aaa;
  font-size: 12px;
  margin-bottom: 14px;
}
.idols {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
.idol {
  background: #292d3a;
  border-radius: 9px;
  padding: 12px;
}
.agency {
  color: #aaa;
  font-size: 10px;
  margin-bottom: 5px;
}
.name {
  font-size: 14px;
  font-weight: bold;
}
hr {
  border: 0;
  border-top: 1px solid #393d4b;
  margin: 22px 0;
}
.note {
  text-align: center;
  color: #777;
  font-size: 11px;
  margin-top: 24px;
}
</style>
</head>
<body>
<div class="container">
  <h1>315 × 283</h1>
  <div class="subtitle">CROSSOVER UNIT GENERATOR</div>

  <button onclick="generate()">ユニットを生成する</button>

  <div class="panel result" id="result">
    <div class="label">SELECTED SONG</div>
    <div class="song" id="song"></div>
    <div class="songAgency" id="songAgency"></div>
    <hr>
    <div class="label">YOUR CROSSOVER UNIT</div>
    <div class="count" id="count"></div>
    <div class="idols" id="idols"></div>
    <hr>
    <button class="secondary" onclick="copyResult()">結果をコピー</button>
    <button onclick="generate()">もう一度抽選する</button>
  </div>

  <div class="note">315 × 283 CROSSOVER GENERATOR</div>
</div>

async function generate() {
  try {
    const response = await fetch("./songs.json");
    if (!response.ok) throw new Error("楽曲データを読み込めません");

    const songsData = await response.json();
    if (!songsData.length) throw new Error("楽曲データが空です");

    const count = Math.floor(Math.random() * 10) + 1;
    const selected = shuffle(idolsData).slice(0, count);
    const song = songsData[Math.floor(Math.random() * songsData.length)];

    document.getElementById("count").textContent = count + " MEMBERS";
    document.getElementById("idols").innerHTML = selected.map(idol => `
      <div class="idol">
        <div class="agency">${idol.work}</div>
        <div class="name">${idol.name}</div>
      </div>
    `).join("");

    document.getElementById("song").textContent = song.title;
    document.getElementById("songAgency").textContent = song.artist || "";

    document.getElementById("result").classList.add("show");
  } catch (error) {
    alert("楽曲データの読み込みに失敗しました。");
    console.error(error);
  }
}

function shuffle(array) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function generate() {
  const count = Math.floor(Math.random() * 10) + 1;
  const selected = shuffle(idolsData).slice(0, count);
  const song = songsData[Math.floor(Math.random() * songsData.length)];

  document.getElementById("count").textContent = count + " MEMBERS";
  document.getElementById("idols").innerHTML = selected.map(idol => `
    <div class="idol">
      <div class="agency">${idol.work}</div>
      <div class="name">${idol.name}</div>
    </div>
  `).join("");

  document.getElementById("song").textContent = song.title;
  document.getElementById("songAgency").textContent = song.artist;

  document.getElementById("result").classList.add("show");
}

function copyResult() {
  const song = document.getElementById("song").textContent;
  const members = [...document.querySelectorAll("#idols .name")]
    .map(el => el.textContent).join("、");
  const text = song + "\n" + members;
  navigator.clipboard.writeText(text).then(() => {
    alert("結果をコピーしました！");
  }).catch(() => {
    alert("コピーできませんでした。");
  });
}
</script>
