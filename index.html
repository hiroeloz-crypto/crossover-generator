
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossover Unit Generator</title>
<style>
:root {
  --bg: #10121b;
  --panel: #1c2030;
  --line: #343a50;
  --text: #f4f4fa;
  --sub: #a9aec3;
  --accent: #c7a6ff;
  --accent2: #8ee5d0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #29253d, var(--bg) 65%);
  color: var(--text);
  font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
  min-height: 100vh;
}
.container {
  width: min(680px, 100%);
  margin: auto;
  padding: 30px 18px 50px;
}
header { text-align: center; padding: 20px 0 28px; }
.tag {
  color: var(--accent);
  letter-spacing: .22em;
  font-size: 12px;
  font-weight: 700;
}
h1 {
  font-size: clamp(28px, 8vw, 42px);
  letter-spacing: .03em;
  margin: 12px 0;
}
.subtitle { color: var(--sub); font-size: 14px; }
.panel {
  background: rgba(28,32,48,.95);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 12px 35px rgba(0,0,0,.18);
}
.label {
  color: var(--sub);
  font-size: 12px;
  letter-spacing: .12em;
  font-weight: 700;
}
button {
  border: 0;
  border-radius: 14px;
  padding: 15px 20px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  color: #181522;
  background: linear-gradient(100deg, var(--accent), var(--accent2));
  width: 100%;
}
button.secondary {
  color: var(--text);
  background: #2b3044;
  border: 1px solid var(--line);
}
button:active { transform: scale(.98); }
.result { display: none; }
.result.show { display: block; }
.count {
  font-size: 48px;
  font-weight: 900;
  margin: 8px 0 18px;
}
.idols {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.idol {
  background: #272c40;
  border: 1px solid #3c425b;
  padding: 13px;
  border-radius: 13px;
}
.idol .agency {
  font-size: 11px;
  color: var(--sub);
  margin-bottom: 5px;
}
.idol .name { font-weight: 700; font-size: 15px; }
.song {
  font-size: 23px;
  font-weight: 800;
  line-height: 1.5;
  margin: 12px 0;
}
.songAgency { color: var(--accent2); font-size: 13px; }
.note {
  color: var(--sub);
  font-size: 12px;
  line-height: 1.8;
}
.actions { display: grid; gap: 10px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
footer {
  text-align: center;
  color: var(--sub);
  font-size: 11px;
  padding: 10px;
}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="tag">315 × 283</div>
  <h1>CROSSOVER<br>UNIT GENERATOR</h1>
  <div class="subtitle">偶然が生み出す、もうひとつのステージ。</div>
</header>

<div class="panel">
  <div class="label">RANDOM GENERATION</div>
  <p class="note">アイドルと楽曲をランダムに選び、仮想ユニットを生成します。</p>
  <button onclick="generate()">GENERATE</button>
</div>

<div class="panel result" id="result">
  <div class="label">YOUR CROSSOVER UNIT</div>
  <div class="count" id="count"></div>
  <div class="idols" id="idols"></div>
  <hr>
  <div class="label">SELECTED SONG</div>
  <div class="song" id="song"></div>
  <div class="songAgency" id="songAgency"></div>
  <hr>
  <div class="actions">
    <button class="secondary" onclick="copyResult()">結果をコピー</button>
    <button onclick="generate()">もう一度抽選する</button>
  </div>
</div>

<div class="panel">
  <div class="label">ABOUT</div>
  <p class="note">
    アイドルの人数・作品比率・楽曲はすべてランダム。
    選ばれたアイドルたちが選出楽曲を歌う、仮想の越境ユニットです。
  </p>
</div>
<footer>Unofficial fan-made tool. Not affiliated with Bandai Namco.</footer>
</div>

// 仮の楽曲データ：後で正式な楽曲一覧に差し替えます。
const songsData = [
  {name:"Reason!!",work:"SideM"},
  {name:"DRIVE A LIVE",work:"SideM"},
  {name:"サイコーCOUNTDOWN",work:"SideM"},
  {name:"Spread the Wings!!",work:"シャニマス"},
  {name:"Multicolored Sky",work:"シャニマス"},
  {name:"いつか Shiny Days",work:"シャニマス"}
];

function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

let lastText = "";

function generate() {
  const count = Math.floor(Math.random() * 10) + 1;
  const selected = shuffle(idolsData).slice(0, count);
  const song = songsData[Math.floor(Math.random() * songsData.length)];

  document.getElementById("count").textContent = count + " MEMBERS";
  document.getElementById("idols").innerHTML = selected.map(idol => `
    <div class="idol">
      <div class="agency">${idol.work}</div>
      <div class="name">${idol.name}</div>
    </div>
  `).join("");

  document.getElementById("song").textContent = song.name;
  document.getElementById("songAgency").textContent = song.work;

  lastText = "CROSSOVER UNIT\n出演人数：" + count + "人\n" +
    selected.map(i => i.work + "／" + i.name).join("\n") +
    "\n楽曲：" + song.work + "／" + song.name;

  document.getElementById("result").classList.add("show");
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
}

function copyResult() {
  if (!lastText) return;
  navigator.clipboard.writeText(lastText)
    .then(() => alert("抽選結果をコピーしました！"))
    .catch(() => alert("コピーできませんでした。"));
}
</script>
</body>
</html>
